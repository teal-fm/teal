# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build iOS

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Test
        working-directory: apps/ios
        run: |
          # Any available iPhone simulator will do.
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d.values() for x in r if x["name"].startswith("iPhone")))')
          xcodebuild test -project Teal.xcodeproj -scheme Teal -destination "id=$DEVICE" CODE_SIGNING_ALLOWED=NO
