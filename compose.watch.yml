# Overlay for host watch processes. Replaces the Amethyst image with a Caddy
# proxy so /xrpc/* and OAuth metadata stay on one origin. The named tunnel in
# compose.dev.yml still targets amethyst:80 when the named-tunnel profile is on.
services:
  amethyst:
    build: !reset null
    image: ${DEV_PROXY_IMAGE:-caddy:2.8-alpine}
    ports: !override
      - "127.0.0.1:8081:80"
    environment:
      DEV_PUBLIC_ORIGIN: ${DEV_PUBLIC_ORIGIN:-http://localhost:8081}
    volumes:
      - ./scripts/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: !reset []
